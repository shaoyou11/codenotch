name: CodenotchT 自动同步与发布
on:
  workflow_dispatch:
  push:
    branches: [custom/compact-draggable]
permissions:
  contents: write
concurrency:
  group: codenotcht-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'shaoyou11/codenotch'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom/compact-draggable
          fetch-depth: 0
      - name: 配置个人版结构化合并并验证自动化规则
        run: |
          python3 Scripts/custom-merge.py configure
          python3 -m unittest discover -s Scripts/custom_tests -v
      - name: 合并上游（真实代码冲突时停止）
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name shaoyou11
          git config user.email shaoyou11@users.noreply.github.com
          git remote add upstream https://github.com/vinzdg/codenotch.git
          git fetch upstream main
          git -c merge.renormalize=true merge --no-edit -m '同步：合并上游 main，保留 CodenotchT 定制' upstream/main
          python3 -m unittest discover -s Scripts/custom_tests -v
      - name: 检查是否需要发布
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/MARKETING_VERSION:/ {print $2; exit}' project.yml)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]
          commit=$(git rev-parse HEAD)
          tag="codenotcht-v${version}-${commit:0:12}"
          gh release list --limit 1000 --json tagName,isDraft,name > "$RUNNER_TEMP/releases.json"
          exists=$(jq --arg tag "$tag" '[.[] | select(.tagName == $tag and .isDraft == false)] | length' "$RUNNER_TEMP/releases.json")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          app_changed=$(python3 Scripts/custom-release-needed.py "$RUNNER_TEMP/releases.json")
          if [ "$exists" -gt 0 ] || [ "$app_changed" = false ]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo '没有应用代码变化，跳过 Xcode 测试和编译。' >> "$GITHUB_STEP_SUMMARY"
          else
            python3 - <<'PYBUILD'
          import json, os, re
          from pathlib import Path
          releases = json.loads(Path(os.environ['RUNNER_TEMP'], 'releases.json').read_text())
          builds = [int(m.group(1)) for r in releases if not r['isDraft']
                    for m in [re.search(r'构建 (\d+)', r.get('name', ''))] if m]
          p = Path('project.yml')
          s = p.read_text()
          current = int(re.search(r'CURRENT_PROJECT_VERSION: "(\d+)"', s).group(1))
          number = max(current, max(builds, default=0) + 1)
          p.write_text(re.sub(r'CURRENT_PROJECT_VERSION: "\d+"', f'CURRENT_PROJECT_VERSION: "{number}"', s))
          PYBUILD
            if ! git diff --quiet -- project.yml; then
              git config user.name shaoyou11
              git config user.email shaoyou11@users.noreply.github.com
              git add project.yml
              git commit -m '发布：递增个人版在线更新构建号'
              commit=$(git rev-parse HEAD)
              tag="codenotcht-v${version}-${commit:0:12}"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "commit=$commit" >> "$GITHUB_OUTPUT"
            fi
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install XcodeGen
        if: steps.version.outputs.needed == 'true'
        run: brew install xcodegen
      - name: Run unit tests
        if: steps.version.outputs.needed == 'true'
        run: make test-ci
      - name: Build CodenotchT app
        if: steps.version.outputs.needed == 'true'
        run: bash Scripts/custom-build.sh
      - name: 签名并生成个人版更新清单
        if: steps.version.outputs.needed == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.CODENOTCHT_SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_KEY"
          signer=build/CustomDerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update
          archive="build/custom/CodenotchT-${RELEASE_VERSION}.zip"
          printf '%s' "$UPDATE_SIGNING_KEY" | "$signer" --ed-key-file - -p "$archive" > "$RUNNER_TEMP/update.signature"
          signature=$(cat "$RUNNER_TEMP/update.signature")
          printf '%s' "$UPDATE_SIGNING_KEY" | "$signer" --ed-key-file - --verify "$archive" "$signature"
          python3 Scripts/personal-appcast.py "$archive" \
            build/CustomDerivedData/Build/Products/Release/CodenotchT.app/Contents/Info.plist \
            "$RELEASE_TAG" "$RUNNER_TEMP/update.signature" build/custom/appcast.xml
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.needed == 'true'
        with:
          name: ${{ steps.version.outputs.tag }}
          path: |
            build/custom/CodenotchT-*.zip
            build/custom/appcast.xml
          if-no-files-found: error
          retention-days: 30
      - name: 保存验证通过的同步结果
        shell: bash
        run: |
          set -euo pipefail
          # 普通推送：并发修改导致分支前进时停止，绝不强推。
          git push origin HEAD:refs/heads/custom/compact-draggable
      - name: 发布安装包
        if: steps.version.outputs.needed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          build_number=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" build/CustomDerivedData/Build/Products/Release/CodenotchT.app/Contents/Info.plist)
          [[ "$build_number" =~ ^[0-9]+$ ]]
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          构建号：${build_number}
          CodenotchT 基于上游版本 ${RELEASE_VERSION}，保留定制面板、透黑胶囊、中文设置和独立应用标识，可与官方版共存。

          本安装包已通过 GitHub 云端单元测试、Release 编译及代码签名校验。
          源码提交：${RELEASE_COMMIT}

          下载 ZIP，解压后将 CodenotchT.app 放入「应用程序」。替换前请先退出应用并备份旧版。本机无需 Xcode 或 XcodeGen。

          使用临时代码签名，未做 Apple 公证；更新包另有独立 Ed25519 签名。构建 38 起支持应用内检查个人版更新，确认后下载并安装。
          EOF
          # 先建草稿，资产全部上传成功后才公开；中断后允许重跑。
          draft=$(jq --arg tag "$RELEASE_TAG" '[.[] | select(.tagName == $tag and .isDraft == true)] | length' "$RUNNER_TEMP/releases.json")
          if [ "$draft" -eq 0 ]; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --draft \
              --title "CodenotchT ${RELEASE_VERSION} · 构建 ${build_number} · ${RELEASE_COMMIT:0:7}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" build/custom/CodenotchT-*.zip build/custom/appcast.xml --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "CodenotchT ${RELEASE_VERSION} · 构建 ${build_number} · ${RELEASE_COMMIT:0:7}"
          echo "已发布 ${RELEASE_TAG}；请到 Releases 下载安装。" >> "$GITHUB_STEP_SUMMARY"
      - name: 失败说明
        if: failure()
        run: echo '同步、测试、编译或发布失败；未完成的安装包不会作为正式新版发布。请检查失败步骤，修复后手动重新运行。' >> "$GITHUB_STEP_SUMMARY"
