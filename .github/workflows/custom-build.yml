name: Build compact app
on:
  workflow_dispatch:
  push:
    branches: [custom/compact-draggable]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run unit tests
        run: make test-ci
      - name: Build CodenotchT app
        run: bash Scripts/custom-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CodenotchT-1.6.0
          path: build/custom/CodenotchT-1.6.0.zip
          retention-days: 30
